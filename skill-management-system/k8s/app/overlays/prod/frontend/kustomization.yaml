apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: frontend
resources:
- deployment.yaml
- service.yaml
namePrefix: sms-
configMapGenerator:
- literals:
  - KEYCLOAK_ISSUER=http://prod-sms-keycloak-headless:8080/realms/skill-management
  - NEXTAUTH_URL=http://skill-management.edag.com
  name: frontend-config
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/component: web
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: skill-management-system
