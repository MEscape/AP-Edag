apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    component: web
    part-of: skill-management-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        component: web
        part-of: skill-management-system
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: skill-management-frontend
        image: registry.skill-management-devops.edag.com/skill-management-frontend:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXTAUTH_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: NEXTAUTH_URL
        - name: KEYCLOAK_ISSUER
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: KEYCLOAK_ISSUER
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: frontend-secret
              key: NEXTAUTH_SECRET
        - name: KEYCLOAK_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: frontend-secret
              key: KEYCLOAK_CLIENT_ID
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: frontend-secret
              key: KEYCLOAK_CLIENT_SECRET
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: next-image-cache
          mountPath: /app/.next/cache/images
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
      volumes:
      - name: next-image-cache
        emptyDir: {}
