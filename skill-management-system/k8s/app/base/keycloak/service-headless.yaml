apiVersion: v1
kind: Service
metadata:
  name: keycloak-headless
  labels:
    app: keycloak
    component: identity-provider
    part-of: skill-management-system
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: keycloak
