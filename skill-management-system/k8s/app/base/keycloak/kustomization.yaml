apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: keycloak-base
resources:
- deployment.yaml
- service.yaml
- service-headless.yaml
configMapGenerator:
- literals:
  - KC_DB_URL=jdbc:postgresql://postgres-service:5432/keycloak
  name: keycloak-config
- files:
  - skill-management-realm.json
  name: keycloak-realm-config
- files:
  - themes/edag/login/theme.properties
  - themes/edag/login/template.ftl
  - themes/edag/login/login.ftl
  - themes/edag/login/register.ftl
  - themes/edag/login/messages/messages_en.properties
  - themes/edag/login/messages/messages_de.properties
  - themes/edag/login/resources/css/common.css
  - themes/edag/login/resources/css/login.css
  - themes/edag/login/resources/css/register.css
  - themes/edag/login/resources/css/template.css
  - themes/edag/login/resources/img/favicon.ico
  - themes/edag/login/resources/img/logo.png
  - themes/edag/login/resources/js/password-strength.js
  - themes/edag/login/resources/js/password-toggle.js
  name: keycloak-theme-config
- files:
  - provider-jar/keycloak-webhook-listener.jar
  name: keycloak-providers
- literals:
  - KC_SPI_EVENTS_LISTENER_WEBHOOK_EVENT_LISTENER_WEBHOOK_URL=http://backend-service:8080/api/v1/webhooks/keycloak
  name: keycloak-webhook-config
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/component: identity-provider
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: skill-management-system
