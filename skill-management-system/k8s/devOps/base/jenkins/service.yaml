apiVersion: v1
kind: Service
metadata:
  name: jenkins-service
  labels:
    app: jenkins
    component: master
    part-of: skill-management-devops
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: agent
    port: 50000
    targetPort: 50000
    protocol: TCP
  selector:
    app: jenkins
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins-agent-service
  labels:
    app: jenkins
    component: agent
    part-of: skill-management-devops
spec:
  type: ClusterIP
  ports:
    - name: agent
      port: 50000
      targetPort: 50000
      protocol: TCP
  selector:
    app: jenkins
