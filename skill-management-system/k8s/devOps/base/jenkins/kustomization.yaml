apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: jenkins-base

resources:
- serviceaccount.yaml
- rbac.yaml
- deployment.yaml
- service.yaml
- pvc.yaml


configMapGenerator:
- files:
  - jenkins.yaml
  name: jenkins-casc-config
- files:
  - plugins.txt
  name: jenkins-plugins
- literals:
  - JENKINS_ROOT_URL=https://jenkins.skill-management-devops.edag.com/
  name: jenkins-config
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/component: master
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/part-of: skill-management-devops
