apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  labels:
    app: jenkins
    component: master
    part-of: skill-management-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
        component: master
        part-of: skill-management-devops
    spec:
      serviceAccountName: jenkins
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: install-ca-certs
        image: jenkins/jenkins:2.534-jdk21
        command:
          - sh
          - -c
          - |
            set -e
            # Create Java keystore directory if it doesn't exist
            mkdir -p /var/jenkins_home/cacerts

            # Copy default Java cacerts to Jenkins home
            cp /opt/java/openjdk/lib/security/cacerts /var/jenkins_home/cacerts/cacerts

            # Import all corporate CA certificates
            for cert in /var/jenkins_certs/*.pem; do
              cert_name=$(basename "$cert" .pem)
              echo "Importing certificate: $cert_name"
              keytool -import -trustcacerts -noprompt \
                -alias "$cert_name" \
                -file "$cert" \
                -keystore /var/jenkins_home/cacerts/cacerts \
                -storepass changeit
            done

            echo "All certificates imported successfully"
        volumeMounts:
          - name: jenkins-home
            mountPath: /var/jenkins_home
          - name: corporate-ca-certs
            mountPath: /var/jenkins_certs
            readOnly: true
      - name: install-plugins
        image: jenkins/jenkins:2.534-jdk21
        command:
          - sh
          - -c
          - |
            set -e
            mkdir -p /var/jenkins_home/plugins
            jenkins-plugin-cli --plugin-file /usr/share/jenkins/ref/plugins.txt --plugin-download-directory /var/jenkins_home/plugins
        env:
        - name: JAVA_OPTS
          value: "-Djavax.net.ssl.trustStore=/var/jenkins_home/cacerts/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
        volumeMounts:
          - name: jenkins-home
            mountPath: /var/jenkins_home
          - name: plugins-list
            mountPath: /usr/share/jenkins/ref/plugins.txt
            subPath: plugins.txt
      containers:
      - name: jenkins
        image: jenkins/jenkins:2.534-jdk21
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 50000
          name: agent
        env:
        - name: JAVA_OPTS
          value: "-Djenkins.install.runSetupWizard=false -Djavax.net.ssl.trustStore=/var/jenkins_home/cacerts/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
        - name: CASC_JENKINS_CONFIG
          value: "/var/jenkins_config"
        - name: REGISTRY_USER
          valueFrom:
            secretKeyRef:
              name: docker-registry-secret
              key: REGISTRY_USER
        - name: REGISTRY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: docker-registry-secret
              key: REGISTRY_PASSWORD
        - name: JENKINS_ROOT_URL
          valueFrom:
            configMapKeyRef:
              name: jenkins-config
              key: JENKINS_ROOT_URL
        - name: JENKINS_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: jenkins-secret
              key: JENKINS_ADMIN_USER
        - name: JENKINS_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: jenkins-secret
              key: JENKINS_ADMIN_PASSWORD
        - name: SONARQUBE_TOKEN
          valueFrom:
            secretKeyRef:
              name: sonarqube-secret
              key: SONARQUBE_TOKEN
        - name: BITBUCKET_USERNAME
          valueFrom:
            secretKeyRef:
              name: bitbucket-secret
              key: BITBUCKET_USERNAME
        - name: BITBUCKET_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bitbucket-secret
              key: BITBUCKET_PASSWORD
        - name: BITBUCKET_REPO_HTTP_URL
          valueFrom:
            secretKeyRef:
              name: bitbucket-secret
              key: BITBUCKET_REPO_HTTP_URL
        - name: BITBUCKET_SERVER_URL
          valueFrom:
            secretKeyRef:
              name: bitbucket-secret
              key: BITBUCKET_SERVER_URL
        - name: BITBUCKET_REPO_OWNER
          valueFrom:
            secretKeyRef:
              name: bitbucket-secret
              key: BITBUCKET_REPO_OWNER
        - name: BITBUCKET_REPO_NAME
          valueFrom:
            secretKeyRef:
              name: bitbucket-secret
              key: BITBUCKET_REPO_NAME
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /login
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /login
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        volumeMounts:
        - name: jenkins-home
          mountPath: /var/jenkins_home
        - name: jenkins-casc-config
          mountPath: /var/jenkins_config
          readOnly: true
      volumes:
      - name: jenkins-home
        persistentVolumeClaim:
          claimName: jenkins-pvc
      - name: jenkins-casc-config
        configMap:
          name: jenkins-casc-config
      - name: plugins-list
        configMap:
          name: jenkins-plugins
      - name: corporate-ca-certs
        configMap:
          name: corporate-ca-certs
