jenkins:
  systemMessage: "Skill Management System - DevOps Jenkins"
  numExecutors: 0
  mode: EXCLUSIVE
  scmCheckoutRetryCount: 3

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASSWORD}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  clouds:
    - kubernetes:
        name: "kubernetes"
        serverUrl: "https://kubernetes.default"
        namespace: "skill-management-devops-prod"
        jenkinsUrl: "http://prod-sms-jenkins-service:8080"
        jenkinsTunnel: "prod-sms-jenkins-agent-service:50000"
        containerCapStr: "10"
        connectTimeout: 5
        readTimeout: 15
        maxRequestsPerHostStr: "32"
        retentionTimeout: 5

        templates:
          - name: "frontend-agent"
            label: "frontend"
            nodeUsageMode: "EXCLUSIVE"
            containers:
              - name: "nodejs"
                image: "node:20"
                command: "sleep"
                args: "infinity"
                workingDir: "/home/jenkins/agent"
                ttyEnabled: true
                resourceRequestCpu: "1000m"
                resourceRequestMemory: "2Gi"
                resourceLimitCpu: "2000m"
                resourceLimitMemory: "4Gi"
              - name: "docker"
                image: "docker:24-cli"
                command: "sleep"
                args: "infinity"
                workingDir: "/home/jenkins/agent"
                ttyEnabled: true
                resourceRequestCpu: "200m"
                resourceRequestMemory: "256Mi"
                resourceLimitCpu: "500m"
                resourceLimitMemory: "512Mi"
              - name: "jnlp"
                image: "jenkins/inbound-agent:alpine3.22-jdk21"
                workingDir: "/home/jenkins/agent"
                ttyEnabled: true
                resourceRequestCpu: "200m"
                resourceRequestMemory: "256Mi"
                resourceLimitCpu: "500m"
                resourceLimitMemory: "512Mi"
            volumes:
              - hostPathVolume:
                  hostPath: "/var/run/docker.sock"
                  mountPath: "/var/run/docker.sock"

          - name: "backend-agent"
            label: "backend"
            nodeUsageMode: "EXCLUSIVE"
            containers:
              - name: "maven"
                image: "maven:3-eclipse-temurin-25"
                command: "sleep"
                args: "infinity"
                workingDir: "/home/jenkins/agent"
                ttyEnabled: true
                resourceRequestCpu: "500m"
                resourceRequestMemory: "512Mi"
                resourceLimitCpu: "1000m"
                resourceLimitMemory: "1Gi"
              - name: "docker"
                image: "docker:24-cli"
                command: "sleep"
                args: "infinity"
                workingDir: "/home/jenkins/agent"
                ttyEnabled: true
                resourceRequestCpu: "200m"
                resourceRequestMemory: "256Mi"
                resourceLimitCpu: "500m"
                resourceLimitMemory: "512Mi"
              - name: "jnlp"
                image: "jenkins/inbound-agent:alpine3.22-jdk21"
                workingDir: "/home/jenkins/agent"
                ttyEnabled: true
                resourceRequestCpu: "200m"
                resourceRequestMemory: "256Mi"
                resourceLimitCpu: "500m"
                resourceLimitMemory: "512Mi"
            volumes:
              - hostPathVolume:
                  hostPath: "/var/run/docker.sock"
                  mountPath: "/var/run/docker.sock"
              - emptyDirVolume:
                  mountPath: "/root/.m2"
                  memory: false

          - name: "universal-agent"
            label: "universal"
            nodeUsageMode: "NORMAL"
            containers:
              - name: "tools"
                image: "alpine:3.22.2"
                command: "sleep"
                args: "infinity"
                workingDir: "/home/jenkins/agent"
                ttyEnabled: true
                resourceRequestCpu: "100m"
                resourceRequestMemory: "128Mi"
                resourceLimitCpu: "200m"
                resourceLimitMemory: "256Mi"
              - name: "jnlp"
                image: "jenkins/inbound-agent:alpine3.22-jdk21"
                workingDir: "/home/jenkins/agent"
                ttyEnabled: true
                resourceRequestCpu: "200m"
                resourceRequestMemory: "256Mi"
                resourceLimitCpu: "500m"
                resourceLimitMemory: "512Mi"

          - name: "kubectl-agent"
            label: "kubectl"
            nodeUsageMode: "EXCLUSIVE"
            serviceAccount: "prod-sms-jenkins"
            containers:
              - name: "kubectl"
                image: "alpine/k8s:1.31.13"
                command: "sleep"
                args: "infinity"
                workingDir: "/home/jenkins/agent"
                ttyEnabled: true
                resourceRequestCpu: "100m"
                resourceRequestMemory: "128Mi"
                resourceLimitCpu: "200m"
                resourceLimitMemory: "256Mi"
              - name: "jnlp"
                image: "jenkins/inbound-agent:alpine3.22-jdk21"
                workingDir: "/home/jenkins/agent"
                ttyEnabled: true
                resourceRequestCpu: "200m"
                resourceRequestMemory: "256Mi"
                resourceLimitCpu: "500m"
                resourceLimitMemory: "512Mi"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonarqube-token"
              secret: "${SONARQUBE_TOKEN}"
              description: "SonarQube authentication token"
          - usernamePassword:
              scope: GLOBAL
              id: "bitbucket-user"
              username: "${BITBUCKET_USERNAME}"
              password: "${BITBUCKET_PASSWORD}"
              description: "Bitbucket credentials"
          - usernamePassword:
              scope: GLOBAL
              id: "docker-registry"
              username: "${REGISTRY_USER}"
              password: "${REGISTRY_PASSWORD}"
              description: "Docker registry credentials"

unclassified:
  location:
    url: "${JENKINS_ROOT_URL}"
  sonarGlobalConfiguration:
    installations:
      - name: "SonarQube"
        serverUrl: "http://prod-sms-sonarqube-service:9000"
        credentialsId: "sonarqube-token"
  bitbucketendpointconfiguration:
    endpoints:
      - bitbucketServerEndpoint:
          displayName: "EDAG Bitbucket"
          serverUrl: "${BITBUCKET_SERVER_URL}"
          credentialsId: "bitbucket-user"
          manageHooks: true

jobs:
  - script: >
      multibranchPipelineJob('skill-management-system') {
        branchSources {
          branchSource {
            source {
              bitbucket {
                id('skill-management-system-bitbucket')
                serverUrl(System.getenv('BITBUCKET_SERVER_URL'))
                repoOwner(System.getenv('BITBUCKET_REPO_OWNER'))
                repository(System.getenv('BITBUCKET_REPO_NAME'))
                credentialsId('bitbucket-user')
                traits {
                  bitbucketBranchDiscovery {
                    strategyId(3)
                  }
                  bitbucketPullRequestDiscovery {
                    strategyId(1)
                  }
                  bitbucketTagDiscovery()
                  bitbucketWebhookRegistration {
                    mode('ITEM')
                  }
                }
              }
            }
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            daysToKeep(30)
            numToKeep(20)
          }
        }
        triggers {
          periodicFolderTrigger {
            interval('5m')
          }
        }
      }
  - script: >
      pipelineJob('skill-management-deploy') {
        definition {
          cps {
            sandbox(true)
            script('''
              pipeline {
                agent { label 'kubectl' }
                options {
                  disableConcurrentBuilds()
                }
                stages {
                  stage('Deploy Backend') {
                    steps {
                      container('kubectl') {
                        sh """
                          set -euxo pipefail
                          kubectl set image deployment/prod-sms-backend -n skill-management-system-prod skill-management-backend=registry.skill-management-devops.edag.com/skill-management-backend:latest --record
                          kubectl rollout restart deployment/prod-sms-backend -n skill-management-system-prod
                          kubectl rollout status deployment/prod-sms-backend -n skill-management-system-prod --timeout=300s
                        """
                      }
                    }
                  }
                  stage('Deploy Frontend') {
                    steps {
                      container('kubectl') {
                        sh """
                          set -euxo pipefail
                          kubectl set image deployment/prod-sms-frontend -n skill-management-system-prod skill-management-frontend=registry.skill-management-devops.edag.com/skill-management-frontend:latest --record
                          kubectl rollout restart deployment/prod-sms-frontend -n skill-management-system-prod
                          kubectl rollout status deployment/prod-sms-frontend -n skill-management-system-prod --timeout=300s
                        """
                      }
                    }
                  }
                }
                post {
                  success {
                    echo "Deployment completed successfully"
                  }
                  failure {
                    echo "Deployment failed"
                  }
                }
              }
            ''')
          }
        }
      }
