# =============================================================================
# DEVELOPMENT ENVIRONMENT OVERRIDES
# =============================================================================
# Only contains settings that differ from base application.yaml
# All common settings are inherited from application.yaml
# =============================================================================

server:
  servlet:
    context-path: /api

spring:
  # Development-specific JPA settings (more verbose for debugging)
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        generate_statistics: true

# =============================================================================
# DEVELOPMENT LOGGING (More Verbose for Debugging)
# =============================================================================
logging:
  level:
    com.edag.skillmanagementsystem: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security.oauth2: DEBUG
  file:
    name: logs/skill-management-dev.log
