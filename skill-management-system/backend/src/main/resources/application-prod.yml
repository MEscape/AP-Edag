# =============================================================================
# PRODUCTION ENVIRONMENT OVERRIDES
# =============================================================================
# Only contains settings that differ from base application.yaml
# All common settings are inherited from application.yaml
# =============================================================================

spring:
  # Production database pool settings (larger pools for production load)
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # Production JPA settings (performance optimized, minimal logging)
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        generate_statistics: false
        jdbc:
          batch_size: 50

# =============================================================================
# PRODUCTION LOGGING (Less Verbose, Optimized for Production)
# =============================================================================
logging:
  level:
    com.edag.skillmanagementsystem: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate: WARN
    root: WARN
  file:
    name: /var/log/skill-management/application.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB
