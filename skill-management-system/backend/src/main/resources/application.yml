# =============================================================================
# BASE APPLICATION CONFIGURATION
# =============================================================================
# This file contains common configuration shared across all environments.
# Environment-specific overrides are in application-{profile}.yaml files.
# =============================================================================

spring:
  application:
    name: skill-management-system

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # -------------------------------------------------------------------------
  # DATABASE CONFIGURATION (Common)
  # -------------------------------------------------------------------------
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  # -------------------------------------------------------------------------
  # JPA CONFIGURATION (Common)
  # -------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # -------------------------------------------------------------------------
  # FLYWAY CONFIGURATION (Common)
  # -------------------------------------------------------------------------
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

  # -------------------------------------------------------------------------
  # OAUTH2 RESOURCE SERVER (Common)
  # -------------------------------------------------------------------------
  security:
    oauth2:
      resourceserver:
        opaquetoken:
          introspection-uri: ${KEYCLOAK_INTROSPECTION_URI}
          client-id: ${OAUTH2_CLIENT_ID}
          client-secret: ${OAUTH2_CLIENT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# =============================================================================
# LOGGING CONFIGURATION (Base)
# =============================================================================
logging:
  level:
    com.edag.skillmanagementsystem: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
    org.springframework.security.oauth2: INFO
  file:
    name: logs/skill-management.log

# =============================================================================
# SPRINGDOC / SWAGGER CONFIGURATION
# =============================================================================
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    oauth:
      client-id: ${OAUTH2_CLIENT_ID}
      client-secret: ${OAUTH2_CLIENT_SECRET}

# =============================================================================
# APPLICATION SPECIFIC CONFIGURATION
# =============================================================================
skill-management:
  # CORS Configuration
  security:
    cors:
      allowed-origins:
        - ${FRONTEND_URL}
        - ${KEYCLOAK_URL}
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - HEAD
      allowed-headers:
        - Authorization
        - Content-Type
      allow-credentials: true
      max-age: 3600
    webhook:
      username: ${WEBHOOK_USERNAME}
      password: ${WEBHOOK_PASSWORD}

  # API Documentation
  spring-doc:
    api-docs:
      title: "Skill Management System API"
      description: "REST API for managing skills, competencies, and user profiles"
      app-version: "1.0.0"
    swagger-ui:
      oauth:
        authorization-url: ${KEYCLOAK_AUTH_URL}
        token-url: ${KEYCLOAK_TOKEN_URL}
        scopes:
          - openid
          - profile
          - email

  # Keycloak Admin Client Configuration
  keycloak-admin:
    server-url: ${KEYCLOAK_URL}
    realm: ${KEYCLOAK_MASTER_REALM}
    target-realm: ${KEYCLOAK_TARGET_REALM}
    username: ${KEYCLOAK_ADMIN_USERNAME}
    password: ${KEYCLOAK_ADMIN_PASSWORD}
    client-id: "admin-cli"
